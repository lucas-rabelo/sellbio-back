version: '3.9'

services:
  db:
    image: postgres:15
    container_name: sellbio-postgres
    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sellbio

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  # redis:
  #   image: redis:7
  #   container_name: sellbio-redis
  #   restart: always

  #   ports:
  #     - "6379:6379"

  #   volumes:
  #     - redis_data:/data

volumes:
  postgres_data:
  # redis_data: