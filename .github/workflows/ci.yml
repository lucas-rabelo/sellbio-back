name: CI Pipeline

on:
  pull_request:
    branches:
      - develop
      - staging
      - main

  push:
    branches:
      - develop
      - staging
      - main

jobs:
  validate-branch-flow:
    runs-on: ubuntu-latest

    steps:
      - name: 🚫 Validate branch flow
        run: |
          echo "Base: ${{ github.base_ref }}"
          echo "Head: ${{ github.head_ref }}"

          if [[ "${{ github.base_ref }}" == "main" && "${{ github.head_ref }}" != "staging" ]]; then
            echo "❌ Só é permitido merge de staging → main"
            exit 1
          fi

          if [[ "${{ github.base_ref }}" == "staging" && "${{ github.head_ref }}" != "developer" ]]; then
            echo "❌ Só é permitido merge de developer → staging"
            exit 1
          fi

          echo "✅ Fluxo de branch válido"

  build:
    runs-on: ubuntu-latest
    needs: validate-branch-flow

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Lint
        run: npm run lint

      - name: 🧪 Run tests
        run: npm run test

      - name: 🏗️ Build project
        run: npm run build